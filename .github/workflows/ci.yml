name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The published package claims Node >=18.18 on every desktop platform.
        # Claiming it is cheap; proving it is what this matrix is for.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Note: the packaging test in the suite above is what actually proves the
      # published artefact works — it packs, installs the tarball and drives the
      # bin symlink. Running `node dist/cli.js` here only proves the module
      # loads, which is how 1.0.0 shipped with a CLI that silently did nothing.
      - name: Smoke test the built CLI
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js doctor --repo fixtures/tiny-java
          node dist/cli.js init --repo fixtures/tiny-java

  java-extractor:
    name: java extractor
    runs-on: ubuntu-latest
    steps:
      # Full history: this is the only job that mines git, and the default
      # shallow checkout would hand it a single commit. Everything would still
      # pass, having proved nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # OpenRewrite's LST parsers need a JDK 17 toolchain to run in. This is
      # the JDK the extractor runs *on*, not the source level it can read: on
      # 17 it happily parses a Java 8 codebase.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs the golden tests, which assert the exact fact output for every
      # fixture. The TypeScript matrix above deliberately never needs a JDK,
      # so this is the only job that proves the parser itself.
      - name: Test the extractor against the fixture goldens
        run: ./mvnw -B --no-transfer-progress verify
        working-directory: extractors/java

      # Nothing above proves the two halves of the NDJSON protocol still agree
      # with each other -- the goldens are checked inside the JVM, and the core
      # is tested against a fake extractor. This is the one place a real jar
      # meets the real fact store.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      #
      # The fixture is a subdirectory of this repository, so `history` also
      # exercises the case where `git log` reports paths from the work tree
      # root while `git ls-files` reports them from the cwd. If those are not
      # reconciled every metric silently comes out empty, and only a real
      # repository shows it.
      - name: Extract, mine and analyse a fixture end to end
        run: |
          npx tsx src/cli.ts init    --repo fixtures/legacy-java
          npx tsx src/cli.ts extract --repo fixtures/legacy-java
          npx tsx src/cli.ts history --repo fixtures/legacy-java
          npx tsx src/cli.ts analyze --repo fixtures/legacy-java

  no-jdk:
    name: no JDK installed
    runs-on: ubuntu-latest
    steps:
      # History mining needs no JDK, so this job needs real commits to prove it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      # A missing JDK must degrade one extractor, never fail the tool. Ubuntu
      # runners ship a JDK, so hide it and confirm the CLI still works.
      - name: Run with java hidden
        run: |
          sudo rm -f /usr/bin/java /usr/local/bin/java || true
          JAVA_HOME= PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -i jdk | grep -v -i java | paste -sd:)" \
            node dist/cli.js doctor --repo fixtures/tiny-java
          JAVA_HOME= node dist/cli.js init --repo fixtures/tiny-java

      # Layer 3 needs no JVM at all, so a machine that cannot run the Java
      # extractor must still get a complete history report. This is the whole
      # reason `analyze` degrades section by section rather than requiring both.
      - name: Mine and analyse history with no JDK
        run: |
          JAVA_HOME= node dist/cli.js history --repo fixtures/tiny-java
          JAVA_HOME= node dist/cli.js analyze --repo fixtures/tiny-java
