name: Release

on:
  push:
    tags: ['v*']

# OIDC for npm provenance: no long-lived NPM_TOKEN with publish rights needed
# beyond the granular automation token, and the package page gets a verified
# provenance badge. See ADR-0004.
permissions:
  contents: write
  id-token: write

jobs:
  # One job, not two. The npm package must carry the SHA-256 of the exact jar
  # attached to the release, so `fetch-extractor` can verify a download against
  # a digest that shipped inside the package rather than one served from the
  # same place as the file it describes (ADR-0004). That pairing only holds if
  # one job builds the jar, pins its digest, publishes, and uploads — split in
  # two, a re-run of half of it silently breaks the pair.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Fail if the tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package version $pkg"; exit 1; }

      - name: Build the Java extractor
        working-directory: extractors/java
        run: ./mvnw -B package

      # Written before publish, so the tarball contains the digest of the jar
      # uploaded below. `files` in package.json ships it.
      - name: Pin the extractor checksum into the package
        run: |
          jar=extractors/java/target/stratigraph-java-extractor.jar
          sha="$(sha256sum "$jar" | cut -d' ' -f1)"
          printf '{\n  "sha256": "%s",\n  "version": "%s"\n}\n' \
            "$sha" "${GITHUB_REF_NAME#v}" > extractor-checksum.json
          cat extractor-checksum.json

      - name: Verify the package would ship it
        run: npm pack --dry-run 2>&1 | grep -q extractor-checksum.json

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After publish: a release with a jar nobody can fetch is recoverable by
      # re-uploading, where a published package pinning a digest for a jar that
      # was never built is not.
      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extractors/java/target/stratigraph-java-extractor.jar
            extractor-checksum.json
          fail_on_unmatched_files: true

  # Last, and in its own job: the image is the third artefact and the only one
  # that can be rebuilt and re-pushed without consequence. CI builds this same
  # Dockerfile on every push, so it is not the first attempt.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
