name: jhipster-sample-app-oauth2
sha: dd599c66fa087a3864cf89c11c8bc402cdb228b6
labelledBy: >-
  Labelled by reading the repo directly at the pinned commit with git/grep/Read only (no stratigraph). roles is a ~28-file sample spanning every role vocabulary word present in the repo; there is no committed lockfile (only package.json is tracked, same as jhipster-sample-app) and no genuinely generated code (GeneratedByJHipster.java is a hand-authored marker annotation applied by the JHipster generator once, not regenerated build output), so `lockfile` and `generated` are omitted from roles. containers lists the one Spring Boot app and the one Angular application project. entities/tables come from src/main/resources/config/liquibase/changelog/00000000000000_initial_schema.xml cross-checked against @Table on the two @Entity classes; the OAuth2 variant still keeps local jhi_user/jhi_authority tables (used to cache/authorize the Keycloak identity) plus a join table and an unused jhi_date_time_wrapper table with no corresponding entity. endpoints is exhaustive (9) from grepping @RequestMapping/ @*Mapping across src/main/java, excluding tests. injections mixes 5 Java constructor-injection edges (only 5 exist between repo-local classes; everything else injects framework types like Environment/JHipsterProperties/ClientRegistrationRepository, which I excluded as not repo-local) with 8 Angular inject()-based edges from @Component/@Directive classes to in-repo services, for 13 total. riskyFiles is omitted: all 6 non-merge commits in the 12 months before the pinned commit are "automatic project update for vX.Y.Z" JHipster generator sweeps touching 74-230 files each, so nothing survives the >50-file-commit filter.
   Role labels normalised to ADR-0030's definitions on review: .mvn/wrapper/maven-wrapper.jar vendored→manifest; src/main/webapp/content/css/loading.css asset→source; src/main/webapp/i18n/en/activate.json other→config; src/main/webapp/i18n/en/adminAuthority.json other→config. Corrected on review: GeneratedByJHipster.java carries @Generated(value = "JHipster") in its header (ADR-0030 generated).
