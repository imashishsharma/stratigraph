name: bitwarden-clients
sha: 45eb0013dc413dab78932c418d209d89371febf6
labelledBy: >
  Labelled by reading the checked-out tree directly (no stratigraph, no
  extractor code): `ls`/`find` across apps/, libs/ and root for structure and
  role sampling (~25 files chosen to span every role actually present),
  angular.json/project.json/package.json per app to classify containers,
  grep for constructor and `inject()` dependency injection across
  apps/browser, apps/web, apps/desktop and libs/vault, libs/components,
  libs/key-management with each injected type resolved to its declaring file,
  and `git log --no-merges --since=2025-09-25 --until=2026-09-25 --name-only`
  (3810 commits) parsed in a scratch Python script, dropping commits that
  touched >50 files (231 dropped, likely repo-wide sweeps/renames), counting
  commits per file, restricted to source-like extensions (.ts/.tsx/.html/.js,
  excluding *.spec.*, tests, config/manifest/docs/lockfile/generated paths),
  and tie-broken by fix-like commit messages (fix|bug|issue|error) and size.
  This is a pure TypeScript/Angular/Nx/Electron monorepo with no Java, so
  `entities` and `tables` are omitted (no JPA, no schema), and `endpoints`
  is omitted (no server-side @Controller-style declarations; Angular routes
  are not HTTP endpoints per the schema). No vendored third-party code or
  `.min.js` was found under version control. Uncertainty: locale
  `messages.json` bundles and `apps/browser/src/manifest.json` (a Chrome
  extension manifest, not a build manifest) required judgment calls, noted
  inline in `roles`; the two "auto-generated" comment hits in
  libs/components/src/file-upload/*.component.ts are false positives (a code
  comment describing a directive's runtime-generated id, not a generated
  file) and are recorded as ordinary source.

roles:
  - { path: package.json, role: manifest }
  - { path: package-lock.json, role: lockfile }
  - { path: angular.json, role: manifest }
  - { path: nx.json, role: manifest }
  - { path: tsconfig.base.json, role: manifest }
  - { path: apps/web/project.json, role: manifest }
  - { path: apps/browser/project.json, role: manifest }
  - { path: apps/desktop/project.json, role: manifest }
  - { path: apps/cli/project.json, role: manifest }
  - { path: babel.config.json, role: config }
  - { path: .prettierrc.json, role: config }
  - { path: eslint.config.mjs, role: config }
  - { path: .github/workflows/stale-bot.yml, role: config }
  - { path: .github/codecov.yml, role: config }
  # Chrome extension manifest: declarative runtime config for the extension
  # (permissions, content scripts, icons), not a build/package manifest in
  # the sense of package.json/angular.json/project.json — classified config.
  - { path: apps/browser/src/manifest.json, role: config }
  - { path: README.md, role: docs }
  - { path: CONTRIBUTING.md, role: docs }
  - { path: docs/cipher-types.md, role: docs }
  - { path: libs/common/src/vault/service-utils.ts, role: source }
  - { path: apps/cli/src/bw.ts, role: source }
  - { path: apps/browser/src/popup/app.component.ts, role: source }
  - { path: apps/desktop/src/app/app.component.ts, role: source }
  - { path: apps/web/src/app/vault/individual-vault/vault.component.ts, role: source }
  - { path: libs/vault/src/services/cipher-action.service.ts, role: source }
  - { path: libs/common/src/tools/rx.spec.ts, role: test }
  - { path: apps/web/src/app/core/web-platform-utils.service.spec.ts, role: test }
  - { path: libs/key-management/src/biometrics/biometric-state.service.spec.ts, role: test }
  # Genuinely codegen'd: header says "auto-generated by NAPI-RS", eslint-disable
  # follows immediately — this is the one confirmed generated file found.
  - { path: apps/desktop/desktop_native/napi/index.d.ts, role: generated }
  # App-level local-storage/state schema migrations (not SQL/DB migrations —
  # this repo has neither a database nor JPA); still the closest analog to
  # the "migration" role since they version and transform persisted state.
  - { path: libs/common/src/key-management/encrypted-migrator/migrations/v2-key-rotation-migration.ts, role: migration }
  - { path: libs/state/src/state-migrations/migration-builder.ts, role: migration }
  # i18n message bundles consumed at runtime, not logic — classified as
  # asset (data shipped with the app) rather than source or config.
  - { path: apps/web/src/locales/en/messages.json, role: asset }
  - { path: apps/browser/src/_locales/en/messages.json, role: asset }
  - { path: apps/web/src/images/search.svg, role: asset }
  - { path: apps/browser/src/images/icon128.png, role: asset }

containers:
  - { name: web, kind: angular-app, path: apps/web }
  # Not a strict web app: browser extension whose popup/sidepanel UI is
  # Angular (84 *.component.ts under apps/browser/src, confirmed via
  # apps/browser/project.json projectType: application). Extension-specific
  # packaging (manifest.json, background scripts) sits alongside the Angular
  # UI; recorded as angular-app since the UI layer genuinely is Angular.
  - { name: browser, kind: angular-app, path: apps/browser }
  # Electron app whose renderer UI is Angular (36 *.component.ts under
  # apps/desktop/src, apps/desktop/project.json projectType: application).
  - { name: desktop, kind: angular-app, path: apps/desktop }
  # Pure Node CLI: no Angular anywhere (0 *.component.ts, no @angular/*
  # dependency used), built on commander/koa, packaged with `pkg`. The
  # schema's container kind vocabulary is spring-boot|war|angular-app, none
  # of which fit — recorded with a free-text kind and flagged here as a
  # deviation from the strict enum.
  - { name: cli, kind: node-cli, path: apps/cli }

