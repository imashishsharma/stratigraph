name: bitwarden-clients
sha: 45eb0013dc413dab78932c418d209d89371febf6
labelledBy: >-
  Read the Nx workspace config (nx.json, angular.json, tsconfig.base.json path-alias map) and each of the 4 apps/* project.json files directly, then used `grep`/`find` across apps/ and libs/ (6421 TS/TSX files — far too many to read exhaustively, so entries below are hand-picked, representative samples rather than a census) to find one example of each role and each injection style. `entities`/`tables` are omitted: this is a pure TypeScript/Angular client monorepo with no ORM or local relational schema of its own (state persistence is a versioned key-value store under libs/state, not tables). `endpoints` is not the empty set some Angular frontends would produce — apps/cli/src/oss-serve-configurator.ts (mounted by apps/cli/src/commands/serve.command.ts, `new Router()` at the app root, no path prefix) defines a genuine local Koa HTTP server for the CLI's `bw serve` command; all 17 of its declared routes are listed (well under the 100-cap, so not sampled). `injections` are 10 edges across web/browser/ desktop and 5 different libs, covering both classic Angular constructor injection (private/readonly constructor params) and the newer `inject(X)` function-call form, written only for tokens resolvable through tsconfig.base.json's `@bitwarden/*` path-alias map to a concrete file in this repo (framework built-ins like DomSanitizer were seen but skipped per instructions). `containers`: apps/web, apps/browser, apps/desktop are Angular applications (@NgModule/bootstrap confirmed via grep in each); apps/cli is also an Nx `projectType: application` but is a plain Node Commander-style CLI with zero Angular usage (no @NgModule/bootstrapApplication anywhere under apps/cli/src) — flagged with kind `node-cli` rather than `angular-app` per the instructions to note non-Angular application projects. bitwarden_license/bit-web, bit-desktop, bit-cli, bit-browser are NOT separate containers: none has its own project.json — they are extra source roots compiled into the corresponding apps/* build, confirmed by `find bitwarden_license -iname project.json` returning nothing. `libs/*` are correctly excluded as libraries, per instructions. Roles follow ADR-0030 exactly: i18n `messages.json` locale bundles are config (named explicitly in the vocabulary), not asset; the app-level `state-migrations/migration-builder.ts` is not a SQL/Liquibase/Flyway schema migration (ADR-0030 scopes `migration` strictly to those), so it is source; `.husky/pre-commit` is a hand-written shell script, so it is source rather than other. `riskyFiles` used `git log --no-merges --since=2025-09-25 --until=2026-09-25 --name-only` (3810 non-merge commits, matching corpus.yaml's "very active"), dropped 231 commits touching >50 files, counted only non-spec/ non-story .ts/.tsx main-source files, and tie-broke the 3-way tie at 43 commits by fix|bug|issue|error-matching commit-subject count. One roles judgment call to flag: libs/common/src/tools/extension/vendor/ is NOT labelled `vendored` despite the directory name — its contents (bitwarden.ts, simplelogin.ts, etc.) are first-party integration code against third-party email-relay *vendors*' APIs, not copied third-party code, confirmed by reading them; no genuine vendored/.min.js bundle was found checked into apps/ or libs/ (all third-party code comes through npm/package-lock.json), so `vendored` is absent from the roles sample rather than forced onto a false match.
   Role labels normalised to ADR-0030's definitions on review: .storybook/main.ts config→source.
