name: spring-petclinic-kotlin
sha: da08609c277f95c37dd91187867f74dbad1090f8
labelledBy: >
  Labelled by reading the repo directly at the pinned commit: `git ls-files` for the
  full tree, `git grep @Entity`/`@Table` for entities, `src/main/resources/db/h2/schema.sql`
  for tables (DDL, matched 1:1 against the six `@Entity` classes plus the `vet_specialties`
  join table which has no entity), each `*Controller.kt` for `@GetMapping`/`@PostMapping`
  for endpoints, Kotlin primary-constructor parameters for injections, and
  `git log --no-merges --since=2025-08-25 --until=2026-08-25 --name-only` (12 months
  before the pinned commit's 2026-08-25 date) for riskyFiles. That window has 31
  non-merge commits but is almost entirely Dependabot version bumps to
  `build.gradle.kts`/`gradle-wrapper.*` plus one test-only refactor; only one main
  `src/main/kotlin` file (`system/CacheConfig.kt`) was touched at all, so `riskyFiles`
  is omitted per the "fewer than 3 qualifying source files" rule. Injections total 8,
  short of the usual ≥10 target, because this is a small app and every controller/
  formatter uses exactly one Kotlin primary-constructor injection with no field/setter
  injection anywhere (`git grep @Autowired` under src/main is empty) — 8 is the full
  set available, not a sample.
