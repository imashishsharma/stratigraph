name: nacos
sha: 1b6309f5086c163a1ff9c0469fabd4494ec09093
labelledBy: >
  Labelled by grep/git/reading files directly at the pinned commit (5291
  Java files, 40+ Maven modules). No JPA anywhere (`grep -rl @Entity` is
  empty) — nacos persists via hand-written JDBC/MyBatis-style DAOs over raw
  SQL, so entities is omitted. containers: found every module with a real
  @SpringBootApplication class + `public static void main` (11 classes
  across 10 modules: address, ai-registry-adaptor, bootstrap, cmdb, config,
  console, istio, naming, prometheus, server[x2]); one false-positive
  (sys/.../NacosTypeExcludeFilter.java) only imports the annotation type and
  isn't itself annotated, excluded. Per distribution/pom.xml (its
  maven-assembly-plugin packages `nacos-bootstrap` as the shipped
  distributable), `bootstrap`'s NacosBootstrap is the actual product
  entrypoint — reading its main() shows it boots NacosServerBasicApplication
  and NacosServerWebApplication (both in `server`) and, depending on
  deployment type, NacosConsole (`console`) and NacosAiRegistry
  (`ai-registry-adaptor`) as nested/child Spring contexts, not as separately
  shipped artifacts. address, cmdb, istio, naming and prometheus have no
  such caller relationship to bootstrap and no spring-boot-maven-plugin
  repackage configured either — they read as legacy or standalone-testable
  modules from nacos's pre-unification (<2.x) architecture. All 10 are
  listed as containers since each genuinely has a committed, real
  @SpringBootApplication + main() (the literal criterion), with this
  caveat spelled out rather than silently picking one "true" deployable.
  console-ui/console-ui-next are React (`"react"` in both package.json,
  confirmed), not Angular, so per the `containers` vocabulary (no `kind` for
  a plain React app) they are NOT listed as containers. tables: from
  plugin-default-impl/.../nacos-datasource-plugin-mysql/.../mysql-schema.sql
  (the reference/default datasource schema), cross-checked against
  mysql-upgrade-visibility-permission-resource.sql (an ALTER, not a table
  add/drop/rename, so it doesn't change the table set) — 16 tables total,
  listed exhaustively (under the 100-item threshold). endpoints: extracted
  with a script that resolves every @RequestMapping/@GetMapping/etc. path,
  including the common nacos pattern of referencing a `public static final
  String ..._PATH` constant (often composed via `+` across multiple
  constants, e.g. `Constants.CONFIG_ADMIN_V3_PATH = BASE_ADMIN_V3_PATH +
  "/config"`) rather than a string literal — resolved 1319 of 1371 such
  constants project-wide via iterative substitution and used that map to
  concatenate class-level + method-level paths for all 69 @RestController
  files under non-test main source. 8 of 346 raw annotation matches could
  not be resolved (array-valued @RequestMapping({...}) with multiple paths,
  or a constant declared without the exact "public static final String"
  shape my scan matched) and were dropped rather than guessed; two
  `@DeleteMapping()` calls with no path argument were correctly resolved to
  their class's base path. 242 valid unique METHOD+path pairs resulted —
  over the 100-item cap, sampled deterministically (sorted, floor(i*n/100)
  for i in 0..99, filling index collisions forward). Spot-checked ~5 sampled
  entries by re-reading their source files directly; all matched. injections
  and roles are direct reads, not samples. riskyFiles: git log --no-merges
  -M over the 12 months before the pinned commit's 2026-09-24 date, dropping
  >50-file commits, main/java non-test files only, no ties in the top 10 (a
  heavy year of churn in the new AI "skills"/agent-specs feature area across
  ai/, console/ and maintainer-client/ modules).
