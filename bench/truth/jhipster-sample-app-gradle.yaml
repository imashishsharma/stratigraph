name: jhipster-sample-app-gradle
sha: 8bdbaacecdb91cf3bef693e01294e82e00c2ac06
labelledBy: >
  Labelled by reading the repo directly at the pinned commit with git/grep/Read only
  (no stratigraph). roles is a ~30-file sample spanning every role vocabulary word
  present; there is no committed lockfile (only package.json is tracked, same
  pattern as the other jhipster samples), so `lockfile` is omitted from roles.
  `generated` is also omitted: GeneratedByJHipster.java is a hand-authored marker
  annotation applied once by the generator, not regenerated build output, and no
  other committed generated code exists. containers lists the one Spring Boot app
  and the one Angular application project. entities/tables come from the Liquibase
  changelog directory (one initial-schema changelog plus per-entity
  added_entity_*.xml files, a JHipster convention for entities added after project
  generation) cross-checked against @Table on each @Entity class; this is the
  "full" JWT-variant JHipster sample so it carries real domain entities
  (BankAccount, Label, Operation) beyond the built-in User/Authority, unlike the
  OAuth2 sample. endpoints is exhaustive (39, well under the 100-sample threshold)
  from grepping @RequestMapping/@*Mapping across src/main/java, excluding tests;
  UserResource's @PutMapping({"/users","/users/{login}"}) is counted as two
  endpoints, one per path. injections mixes 12 Java constructor-injection edges
  between repo-local classes with 3 Angular inject()-based edges, for 15 total.
  riskyFiles is omitted: all 6 non-merge commits in the 12 months before the
  pinned commit are "automatic project update for vX.Y.Z" JHipster generator
  sweeps touching 154-393 files each, so nothing survives the >50-file-commit
  filter.
