  - { path: config/src/main/resources/application.yml, role: config }
  - { path: docker-compose.yml, role: config }
  - { path: account-service/Dockerfile, role: config }
  - { path: .env, role: config }
  - { path: .travis.yml, role: config }
  - { path: .gitignore, role: config }
  - { path: README.md, role: docs }
  - { path: LICENCE, role: docs }
  - { path: .github/ISSUE_TEMPLATE/bug-report-or-feature-request.md, role: docs }
  - { path: gateway/src/main/resources/static/images/piggy.gif, role: asset }
  - { path: gateway/src/main/resources/static/fonts/museo-100/museo-100.woff, role: asset }
  - { path: gateway/src/main/resources/static/css/style.css, role: source }
  - { path: gateway/src/main/resources/static/index.html, role: source }
  - { path: gateway/src/main/resources/static/js/lib/jquery.min.js, role: vendored }
  - { path: account-service/src/main/java/com/piggymetrics/account/domain/Account.java, role: source }
  - { path: account-service/src/main/java/com/piggymetrics/account/controller/AccountController.java, role: source }
  - { path: statistics-service/src/main/java/com/piggymetrics/statistics/service/StatisticsServiceImpl.java, role: source }
