name: piggymetrics
sha: 6bb2cf9ddbca980b664d3edbb6ff775d75369278
labelledBy: >
  Labelled by reading the full `git ls-files` listing, the root aggregator
  pom.xml (packaging=pom, 9 modules), each module's pom.xml (all packaging=jar
  with spring-boot-maven-plugin) and its `@SpringBootApplication` main class,
  every `@RestController` under the 4 modules that expose HTTP (account,
  auth, notification, statistics), and the `@Autowired` field-injection sites
  in each controller/service-impl. This is a Spring Data MongoDB app
  (`@Document(collection=...)` on 5 domain classes, confirmed via
  `git grep @Document`/`@Entity`/`@Table`) — there is no JPA and no relational
  schema, so both `entities` and `tables` are omitted rather than forced onto
  a document store. riskyFiles is omitted: `git log --no-merges` in the 12
  months before the pinned commit's own date (2020-11-15 to 2021-11-15) shows
  only 2 non-merge commits, both "Update README.md" with zero source files
  touched — well under the 3-source-file bar. No package.json/lockfile exists
  anywhere in the repo (pure Maven multi-module backend). Roles follow
  ADR-0030 exactly: the gateway's style.css and static index.html are source
  (styles and HTML templates), not asset; mongodb/init.sh (hand-written shell)
  and mongodb/dump/account-service-dump.js (a hand-written demo-data seed
  script with comments, not a tool-generated mongodump export) are source,
  not other; .gitignore is config (dotfile).
roles:
