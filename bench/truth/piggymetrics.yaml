name: piggymetrics
sha: 6bb2cf9ddbca980b664d3edbb6ff775d75369278
labelledBy: >
  Labelled by reading the repo directly at the pinned commit: `git ls-files` for the
  full tree, the root `pom.xml` `<modules>` list plus each module's `@SpringBootApplication`
  class for containers, `@RestController`/`@RequestMapping` methods for endpoints,
  `@Autowired` field-injection sites for injections, and
  `git log --no-merges --since=2020-11-15 --until=2021-11-15 --stat` (12 months before
  the pinned commit's 2021-11-15 date) for riskyFiles. That window has only 2 commits,
  both `README.md`-only edits with zero source files touched, so `riskyFiles` is omitted
  per the "fewer than 3 qualifying source files" rule — this matches corpus.yaml's note
  that the repo has been dormant since the pinned commit. Persistence is Spring Data
  MongoDB (`@Document(collection = ...)`), not JPA (`git grep -rn "@Entity"` = 0 hits),
  so `entities` and `tables` are both omitted — there is no relational schema to report;
  the `@Document` collection names are effectively the "tables" but the schema vocabulary
  in the README is JPA/SQL-specific and doesn't fit a schemaless document store. `roles`
  has no `generated` (no annotation processors or codegen in this plain Maven/Java
  monorepo), no `lockfile` (Maven has none; the `gateway` module's static JS assets are
  hand-vendored files, not an npm-managed tree with a lockfile), and no `migration` in
  the SQL/Liquibase sense (Mongo has no schema migrations) — `mongodb/init.sh` (user/role
  setup) and `mongodb/dump/account-service-dump.js` (a `mongodump` sample-data export)
  are the closest analogs and are tagged `other` rather than `migration`, explained inline.
