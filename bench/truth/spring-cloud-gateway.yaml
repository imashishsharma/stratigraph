name: spring-cloud-gateway
sha: 88a92c065767a20a5d37753437d15975a8c06c28
labelledBy: >
  Labelled by reading the checkout directly at the pinned sha with `git ls-files`,
  targeted grep for annotations, and reading individual files to confirm class
  bodies. Correction to the corpus.yaml `why` note: at this pin the repo builds
  with Maven (root pom.xml, mvnw, <modules>), not Gradle -- no build.gradle/
  settings.gradle file exists anywhere in the tree. containers: the
  spring-cloud-gateway-server(-webflux|-webmvc) and proxyexchange-webflux/webmvc
  modules are libraries/starters with no main class in src/main; every
  @SpringBootApplication hit found by grep is in test source only (excluded per
  "test code is not architecture"). The 5 containers listed instead use the split
  @SpringBootConfiguration + @EnableAutoConfiguration + public static void main
  pattern (functionally the same as @SpringBootApplication minus component-scan),
  each its own Maven module with its own artifactId: the sample app plus four
  spring-cloud-gateway-integration-tests/* harness apps (mvc-failure-analyzer,
  httpclient, http2, grpc) -- grpc has no REST controller of its own. No JPA
  entities, database schema or migration files exist anywhere in the repo (this
  is a stateless reactive gateway) -- entities/tables omitted. endpoints: found by
  grepping every @RestController/@Controller/@RequestMapping in non-test main
  source repo-wide; the two GatewayControllerEndpoint classes under
  server-webflux/.../actuate are @RestControllerEndpoint (Spring Boot actuator
  operations) and are excluded as out-of-scope per the task spec; gateway routing
  itself (RouteLocator/GatewayFilterFactory/predicates) is a separate
  non-HTTP-mapping-annotation mechanism and is not counted as "endpoints" either.
  The result is a short, exhaustive list of 4 real endpoints, all in
  integration-test sample apps, not the library itself -- this is an intentional
  outcome of the repo's shape, not a labelling shortfall. injections is a sample
  of DI edges into the library's GlobalFilter implementations (server-webflux).
  riskyFiles: git log --no-merges over the 12 months before the pinned commit's
  2026-09-24 date, dropping >50-file commits, weighted by fix-like messages then
  file size; one file's history is split across a mid-window module rename
  (spring-cloud-gateway-server-mvc -> spring-cloud-gateway-server-webmvc) and was
  manually merged onto its current path (confirmed the old path no longer exists
  at HEAD).
