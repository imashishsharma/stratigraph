name: spring-cloud-gateway
sha: 88a92c065767a20a5d37753437d15975a8c06c28
labelledBy: >
  Labelled by reading the checked-out repo directly (git ls-files,
  grep/ripgrep, and reading full source), no stratigraph involvement.
  Correction to the corpus.yaml `why` note: this is a Maven multi-module
  build (root pom.xml with <modules>, mvnw/.mvn wrapper), not Gradle — no
  build.gradle/settings.gradle exist anywhere in the tree. This is a
  reactive gateway library, not a CRUD app: exhaustive grep for @Entity,
  @Table, CREATE TABLE, liquibase and flyway found nothing, so `entities`
  and `tables` are omitted. `containers`: four modules have both a genuine
  `public static void main` and @SpringBootConfiguration+@EnableAutoConfiguration
  (equivalent to @SpringBootApplication) — spring-cloud-gateway-sample (has
  spring-boot-maven-plugin too) plus three integration-test demo apps
  (grpc/http2/httpclient) under spring-cloud-gateway-integration-tests/*, all
  runnable independently; included per the spec's rule that a sample app IS
  a deployable (these are functionally the same shape as a samples/ app,
  just under a differently-named directory). One similar-looking class,
  mvc-failure-analyzer's MvcFailureAnalyzerApplication, has the same
  annotations but was verified to have NO main() method anywhere in that
  module, so it was excluded — it's wired up by something else, not
  independently runnable. Every other module
  (-server/-server-webflux/-server-webmvc/-proxyexchange-*) is a
  library/starter jar with no main class. `endpoints`: excludes the two
  @RestControllerEndpoint classes (GatewayControllerEndpoint,
  GatewayLegacyControllerEndpoint) as actuator ops per the task's scope
  rule; the 3 endpoints listed all come from @RestController/@GetMapping in
  the integration-tests modules' src/main/java (demo/fixture apps, not the
  gateway's own product surface — the gateway itself is a filter/predicate
  proxy framework with no controller-based endpoints of its own, by
  design). `riskyFiles`/`roles`/`injections` are exhaustive-enough manual
  reads, not samples (well under 100 candidates in every section).
  riskyFiles computed via `git log --no-merges` over non-test .java files in
  the 12 months before the pinned commit's date (2025-09-24 to 2026-09-24
  21:29), dropping commits touching >50 files, counted per the file's
  current path; ties broken by fix-like commit messages (fix|bug|issue|error).
  Role labels follow bench/README.md's ADR-0030 vocabulary table exactly
  (build wrappers including the wrapper jar are `manifest`; dotfiles and
  non-prose YAML/XML are `config`; LICENSE is `docs`).

