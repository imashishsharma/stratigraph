name: killbill
sha: 4bdc2b24ad298f8e47dda5ac1ddeac7f34687377
labelledBy: >
  Read every pom.xml's packaging/artifactId, every ddl.sql (10 files across
  the account/api/beatrix/catalog/entitlement/invoice/payment/subscription/
  tenant/util modules) and every migration/V*__*.sql that contains a DROP
  TABLE for schema-fix re-creations, and the profiles/killbill and
  profiles/killpay webapp/resources trees, directly. `entities` is omitted:
  `git grep` confirms zero @Entity/@Table classes anywhere — persistence is
  JDBI SQL-object DAOs, matching corpus.yaml. `tables` (63, under the 100
  cap, no sampling needed) comes from `create table` statements across the 10
  ddl.sql files; the 5 migration files with DROP TABLE IF EXISTS are
  drop-and-recreate schema fixes under the same table name (not
  renames/removals), so they don't change the ddl.sql-derived set. Containers
  are the two WAR profiles (killbill, killpay) confirmed via
  <packaging>war</packaging>; all other modules are <packaging>jar</packaging>
  libraries or the root/`profiles` aggregator poms, not containers.
  `endpoints` were extracted with a small script (not stratigraph) that
  parses the 28 JAX-RS resource classes under jaxrs/src/main/java/.../resources,
  resolves class- and method-level @Path string-literal concatenations
  against the named constants defined in JaxrsResource.java (e.g.
  ACCOUNTS_PATH = PREFIX + "/" + ACCOUNTS), and keeps only methods carrying an
  explicit @GET/@POST/@PUT/@DELETE (JAX-RS has no Spring-style default-GET
  rule, so a small number of @Path-only helper methods with no HTTP-verb
  annotation are correctly excluded) — spot-checked several entries
  (AccountResource#closeAccount, PaymentResource#cancelScheduledPaymentTransactionByExternalKey,
  PluginResource's deliberately-slash-less "/plugins{subResources:.*}" catch-all)
  against the source directly. This produced 278 unique "METHOD /path"
  strings, over the 100 cap, sampled deterministically to exactly 100 by
  taking indices floor(i*278/100) for i in 0..99 from the sorted unique list.
  `injections` are @Inject-annotated constructor injection (Killbill's DI is
  Guice, not Spring; @Inject is used the same way Spring uses constructor
  injection, so `via: constructor` is used per the given vocabulary), sampled
  across 3 different JAX-RS resource classes (AccountResource, PaymentResource,
  InvoiceResource) and their injected killbill-api interfaces. `riskyFiles`
  used `git log --no-merges --since=2025-09-24 --until=2026-09-24
  --name-only`, dropped the 2 of 154 commits touching >50 files, counted
  non-test .java files, and tie-broke same-count files by count of
  fix|bug|issue|error-matching commit subjects. Roles follow ADR-0030 exactly:
  the profiles/*/src/main/webapp/*.html admin-console pages are source
  (HTML templates), corrected from an earlier "static asset" judgment call.
  killbill has no committed generated code (checked for @Generated/DO NOT
  EDIT markers — one hit was a false positive, a javadoc comment), no Maven
  wrapper (no mvnw/.mvn/wrapper present), and no lockfile (pure Maven, and
  the vendored webapp JS/CSS under webapp/lib and webapp/css are hand-copied
  static files, not an npm-managed tree) — all three noted as genuinely
  absent rather than forced into the sample.
