name: analog
sha: 40cc8b45586549ff95679eef245901122613acd3
labelledBy: >-
  Labelled by reading the checked-out worktree directly with git/grep/ls and Read (no stratigraph, no .stratigraph/, no tool source). analog is an Nx/pnpm monorepo with 0 Java files (confirmed via corpus.yaml and `git ls-files`), so entities/tables/endpoints are omitted entirely — there is no JPA/DB backend. containers were determined by reading every project.json's "projectType" field and, for the "application" ones, checking whether the project has real build/serve targets vs. being an e2e-test-only harness (the five *-e2e projects are projectType:application but only run playwright/lint, so they are excluded as non-deployables). injections were found by grepping every @Injectable/ @Component/@Directive class for inject()/constructor-parameter use and manually tracing each injected symbol back to its declaring file; the framework overwhelmingly uses inject() inside plain functions (route loaders, server functions, interceptors) rather than inside decorated classes, and favors InjectionTokens over injectable classes for its own extension points, so genuine class-to-class DI edges are naturally sparse — I found 9, two of which target an InjectionToken constant (CONTENT_LOCALE) rather than a class, flagged inline. riskyFiles is a full commit-file tally (not a sample) over git log --no-merges --since=2025-09-26 --until=2026-09-26T16:04:36Z (12 months before the pinned commit's author date), dropping the 10 commits that touched >50 files (these are release-automation commits that bump every package.json's version in lockstep and are pure noise, not risk signal); versions.ts constant files under packages/*/versions/ were also excluded even though some have hundreds of touches, because they are pure auto-bumped version-pin tables with no logic. roles is a sample of 26 files, not exhaustive; no vendored code or migration files were found anywhere in the repo. Corrected against ADR-0030 (bench/README.md): LICENSE is `docs` (explicitly named alongside README in the vocabulary), not `other`.
   Role labels normalised to ADR-0030's definitions on review: eslint.config.mjs config→source; commitlint.config.cjs config→source; apps/analog-app/vite.config.ts config→source; apps/analog-app/src/public/assets/shipping.json asset→config.
