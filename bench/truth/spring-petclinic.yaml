labelledBy: >
  Labelled by reading the full checked-out tree (git ls-files, 121 files total)
  and every main-source Java file, pom.xml, schema/data SQL, and controller
  class directly; entities/tables/endpoints/injections are exhaustive (repo is
  the small 50-Java-file baseline), not sampled. riskyFiles derived from
  `git log --no-merges --since=2025-08-26 --until=2026-08-26 --name-only`
  (326 lines, no >50-file sweep commits), counting commits per src/main/java
  file and breaking ties by fix-flavoured commit messages. Uncertain calls:
  messages_*.properties and CI workflow YAML classified as config per the
  vocabulary; the MySQL setup .txt classified as docs (prose instructions,
  not a config file); montserrat/varela webfont binaries and the checked-in
  gradle-wrapper.jar classified as vendored (third-party binaries bundled
  into the repo, not authored here) rather than asset/manifest. No
  "generated" or "lockfile" role exists in this repo (pure Java/Maven+Gradle,
  no package.json/npm at all, and no checked-in codegen output found).
  injections lists only 6 edges (below the usual >=10 target) because that is
  the full set of real DI in the app: grep found zero @Autowired/@Resource
  usages anywhere in src/main/java, and the two @Configuration classes only
  declare no-arg @Bean factory methods with nothing injected into them.
