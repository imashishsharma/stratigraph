name: spring-boot-realworld-example-app
sha: ee17e31aafe733d98c4853c8b9a74d7f2f6c924a
labelledBy: >-
  Read build.gradle, .gitignore, the Flyway migration, every file under src/main/resources (mapper/, schema/, db/migration/), and every one of the 8 REST controllers under src/main/java/io/spring/api plus their injected collaborator interfaces (116 Java files total; small enough that endpoints and injections below are exhaustive, not sampled). Confirmed via `git grep` that there are zero @Entity/@Table classes (persistence is MyBatis XML mappers under src/main/resources/mapper, matching corpus.yaml's note that this pin is not actually JPA) — `entities` is omitted per the truth-format instructions for a non-JPA persistence layer. `tables` comes directly from the single Flyway migration V1__create_tables.sql.yaml's post-pin dormancy note, which is a different window) — 27 non-merge commits, none touching >50 files, counted per src/main file and tie-broken by fix-like messages. Roles follow ADR-0030 exactly: gradle/wrapper/* (including the wrapper jar) is manifest, not vendored; dotfiles (.gitignore) are config; MyBatis mapper XML and the GraphQL SDL are source (hand-written program text), not config. No lockfile and no generated code are committed (build/ and .gradle are gitignored, with only gradle-wrapper.jar force-included).
   riskyFiles corrected on review: the 12 months before the pinned commit (2021-06-08..2022-06-08) hold 27 non-merge commits; the four main-source files with 2+ commits are listed, the rest tie at one commit and are left out.
roles:
