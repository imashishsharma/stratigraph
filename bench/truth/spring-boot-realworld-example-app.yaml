  - { path: gradlew, role: manifest }
  - { path: gradlew.bat, role: manifest }
  - { path: gradle/wrapper/gradle-wrapper.properties, role: manifest }
  - { path: gradle/wrapper/gradle-wrapper.jar, role: manifest }
  - { path: src/main/resources/db/migration/V1__create_tables.sql, role: migration }
  - { path: src/main/resources/mapper/ArticleMapper.xml, role: source }
  - { path: src/main/resources/mapper/UserMapper.xml, role: source }
  - { path: src/main/resources/schema/schema.graphqls, role: source }
  - { path: src/main/resources/application.properties, role: config }
  - { path: src/main/resources/application-test.properties, role: config }
  - { path: src/main/java/io/spring/api/ArticlesApi.java, role: source }
  - { path: src/main/java/io/spring/api/UsersApi.java, role: source }
  - { path: src/main/java/io/spring/core/article/Article.java, role: source }
  - { path: src/main/java/io/spring/core/user/User.java, role: source }
  - { path: src/main/java/io/spring/graphql/ArticleDatafetcher.java, role: source }
  - { path: src/test/java/io/spring/api/ArticlesApiTest.java, role: test }
  - { path: src/test/java/io/spring/infrastructure/user/MyBatisUserRepositoryTest.java, role: test }
  - { path: src/test/java/io/spring/api/TestWithCurrentUser.java, role: test }
  - { path: src/test/java/io/spring/TestHelper.java, role: test }
  - { path: .gitignore, role: config }
  - { path: README.md, role: docs }
  - { path: LICENSE, role: docs }
  - { path: example-logo.png, role: asset }
  - { path: graphql-schema.png, role: asset }
containers:
