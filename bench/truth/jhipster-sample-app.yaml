labelledBy: >
  Labelled by reading the repo directly at the pinned commit: entities from
  src/main/java/.../domain, table names cross-checked against the Liquibase
  changelogs under src/main/resources/config/liquibase/changelog (all
  @Table(name=...) values match the createTable statements exactly), endpoints
  enumerated from every @RestController class-level + method-level mapping
  under src/main/java/.../web/rest, injections from constructor-injected
  fields in REST resources and the service layer (plain explicit constructors,
  no Lombok here), and containers confirmed from pom.xml artifactId +
  @SpringBootApplication for the backend and angular.json's single
  "jhipster-sample-application" application project for the frontend.
  riskyFiles omitted: `git log --no-merges --since=2025-09-17
  --until=2026-09-17T21:28:19-0600 --name-only` found only 7 commits in the
  window, every one an "automatic project update for vX.Y.Z" bot commit
  touching 81-377 files (all above the 50-file sweep cutoff), so zero commits
  remain after dropping sweeps and no source file has real per-file history in
  this window — matches corpus.yaml's note that this is a low-churn template
  repo. No package-lock.json/yarn.lock is committed (confirmed via `git
  ls-files`), so `lockfile` is not represented in roles despite package.json
  being present; no separate generated-code output directory exists either
  (JHipster scaffolds the whole app as ordinary editable source, not a
  regenerate-on-build artifact), so `generated` is also omitted. Roles were
  re-checked against ADR-0030's vocabulary table in bench/README.md: CSS
  (loading.css) is `source`, i18n JSON (password.json) and .gitignore are
  `config`, and the Maven wrapper jar is `manifest` (build wrapper), not
  `vendored`.
