name: spring-petclinic-angular
sha: 1978a75eab0c803595d5cde75acc6a0a9bcff4de
labelledBy: >
  Labelled by reading `git ls-files`, `angular.json`, and source files directly at
  the pinned commit (checked out detached). Roles sampled across all files present;
  there is no `migration` role in this repo (frontend-only, no database). `entities`,
  `tables` and `endpoints` are omitted: this is an Angular client with no backend of
  its own — it calls a separate spring-petclinic-rest API (see
  src/environments/environment.ts REST_API_URL) but declares no JPA entities, no
  tables and no server-side controllers in this repo. `injections` covers every
  local-to-local constructor-injection edge found via `git grep 'constructor('`
  across src/app, restricted to pairs where both classes are defined in this repo
  (Angular framework services like HttpClient/Router/ActivatedRoute/FormBuilder are
  excluded as targets); the 4 uses of the newer `inject()` function found
  (`inject(ChangeDetectorRef)`) are framework-only so no `inject()`-based edges
  qualify. `riskyFiles`: only one fix-like commit (122c227, "fix page templates
  refresh issue (#178)") touched more than one main-source file in the 12 months
  before the pinned commit (2025-09-12..2026-09-12); the repo is very low-churn
  (24 non-merge commits total in that window, one large >50-file dependency-bump
  commit excluded per the rule). Only 4 files have any repeatable signal at all, all
  tied at 1 qualifying commit each — ranking among them is by file size, and the
  signal here is weak by volume even though each is a genuine fix commit.
