labelledBy: >-
  Labelled by reading the repo directly at the pinned commit with git/grep/Read only (no stratigraph). roles is a ~26-file sample spanning every role vocabulary word present. This is a frontend-only Angular repo (NgModule-era, per corpus.yaml) with no backend of its own, so `entities`, `tables`, `endpoints` and `migration`-role files are all absent — there is no server source in this repo to declare HTTP endpoints or JPA entities against; noted rather than guessed. containers is the single Angular application project (angular.json `projectType: application`, root ""). The `docs/` directory is committed output of the compodoc documentation generator (confirmed: README.md:53-59 documents `npx @compodoc/compodoc -p tsconfig.doc.json -d docs`, and docs/llms.txt:3 literally says "Generated by compodoc 2.0.0...") — docs/index.html, docs/routes.html etc. are labelled `generated`, while the third-party minified JS/CSS/font files compodoc bundles alongside its output (docs/js/libs/*.min.js, docs/fonts/*, docs/styles/bootstrap.min.css) are labelled `vendored` rather than `generated` since they aren't derived from this project's own code. Corrected against ADR-0030 (bench/README.md): src/assets/css/petclinic.css is hand-written (not minified/third-party — a 312-line file of local @font-face/theme overrides) so it is `source`, not `asset`; fonts remain `asset`. injections is 10 constructor-injection edges (NgModule-era: `constructor(private x: Y)`, no `inject()` calls found in this repo) from list components to their services and from services to the shared HttpErrorHandler in error.service.ts. riskyFiles: of 21 qualifying non-merge commits (dropping 2 that each touched >50 files) in the 12 months before the pinned commit (2025-09-12 to 2026-09-12), the large majority are dependency-bump commits touching only package.json/package-lock.json; only 4 main-source .ts files were touched at all, each by exactly one commit — 4 of them by the single fix commit "fix page templates refresh issue (#178)" and a 5th (src/app/testing/testing.module.ts) by an unrelated Karma-to-Vitest migration commit, but that file no longer exists at the pinned commit (deleted by that same migration) so it is excluded; signal here is thin (all tied at 1 commit) but the file count clears the >=3-file inclusion bar, so riskyFiles is included rather than omitted, ranked by fix-commit tie-break then file line count.
   Role labels normalised to ADR-0030's definitions on review: eslint.config.js manifest→source; docs/fonts/roboto-v15-latin-regular.woff2 vendored→asset; src/environments/environment.ts config→source.
