name: spring-boot-admin
sha: 9d667167671483d93c1265545c68c0c6d6618405
labelledBy: >
  Labelled by reading the checked-out repo directly (git ls-files, grep, and
  reading full source) at the pinned commit, no stratigraph involvement.
  `entities`/`tables` omitted: exhaustive grep for @Entity, @Table, CREATE
  TABLE, liquibase and flyway found nothing (spring-boot-admin holds
  registered-instance state in memory / an InstanceRepository abstraction,
  not a relational schema — `grep -rl @Entity --include=*.java` returns 0
  hits). `containers`: checked every module's pom.xml packaging and every
  main-source class for @SpringBootApplication or the equivalent
  @Configuration+@EnableAutoConfiguration combo; spring-boot-admin-server,
  -server-mcp, -server-ui, -client and the two starter-* modules are
  libraries with no main class, so only spring-boot-admin-samples/* count —
  9 of its 10 sub-modules are runnable Spring Boot apps (kind spring-boot,
  one of them `-war` per its <packaging>war</packaging>); the 10th,
  sample-custom-ui, is a pure Vue/Vite frontend example with no Java at all
  and is excluded. `endpoints`: spring-boot-admin's own controllers use a
  custom class-level marker `@AdminController` (an empty
  @Retention(RUNTIME) annotation, not itself meta-annotated with
  @Controller) plus method-level @GetMapping/@PostMapping/@RequestMapping —
  included as endpoints since the routes are genuinely declared by those
  method annotations (the spec's "@RequestMapping-declared routes" is read
  to cover this), flagged here since it's not the literal
  @RestController/@Controller case. The two InstancesProxyController
  variants (servlet/reactive) declare the same two wildcard paths with a
  7-method @RequestMapping array (GET/HEAD/POST/PUT/PATCH/DELETE/OPTIONS);
  listed once per method+path (not duplicated per servlet-vs-reactive
  variant, since the declared route text is identical) to avoid inflating
  the count with what's really one design decision expressed twice.
  `riskyFiles` computed via `git log --no-merges -M` over the 12 months
  before the pinned commit's date (2025-09-25 to 2026-09-25), dropping
  commits touching >50 files, restricted to non-test .java under
  src/main/java; 46 distinct files touched, well above the 3-file minimum.
  roles/injections are direct reads, not samples.

