name: openmrs-core
sha: a521ee30a53909c48e4567ddab1ec758b9b59be0
labelledBy: >
  Labelled by reading the checked-out repo directly at the pinned commit: git ls-files for
  roles, root pom.xml <modules> plus per-module <packaging> and grep for
  @SpringBootApplication (none found - openmrs-core predates Spring Boot entirely) for
  containers, a script-assisted grep for @Entity across api/src/main plus the resolved
  @Table(name=...) on every hit for entities, and Liquibase changelog XML for tables.
  openmrs maps most of its domain model two ways: 86 classes carry JPA/Hibernate's
  `@Entity` annotation directly (all 86 also carry an explicit `@Table(name=...)`, so no
  naming-convention guessing was needed), while a separate, larger set of legacy classes
  (e.g. org.openmrs.notification.Alert) are mapped instead via 20 Hibernate `*.hbm.xml`
  files under api/src/main/resources/.../hibernate/ - per this task's instructions only the
  86 `@Entity`-annotated classes are listed in `entities`, but the tables those *.hbm.xml
  files map to (e.g. notification_alert, notification_alert_recipients) are still present in
  `tables` since they come from the schema, not from the entity scan. `tables`: the
  "back-compat" entrypoint api/src/main/resources/liquibase-schema-only.xml only includes
  the 2.8.x snapshot (117 tables), but api/src/main/resources/org/openmrs/liquibase/
  snapshots/schema-only/liquibase-schema-only-2.9.x.xml is newer and adds 2 more
  (outbox_event, shedlock) with liquibase-update-to-latest-3.0.x.xml (the file actually
  wired into api/src/main/resources/liquibase-update-to-latest.xml, i.e. the modern
  incremental-update entrypoint) adding no further createTable statements on top of 2.9.x -
  so the 2.9.x snapshot's 119 tables were used as the base. A 120th table, revision_entity,
  was added by hand: it is the Hibernate Envers revision-tracking table
  (api/src/main/java/org/openmrs/api/db/hibernate/envers/OpenmrsRevisionEntity.java,
  @RevisionEntity, @Table(name="revision_entity")) which Envers manages via Hibernate's own
  DDL rather than an explicit Liquibase changeset, so it never appears in any changelog XML
  despite being a real table the running app creates and uses. 120 tables > 100, so
  deterministically sampled to 100 (sorted, stride 1.2), noted. entities (86) is under 100,
  not sampled. `endpoints` is omitted entirely: openmrs-core's own web/webapp modules use
  pre-annotation Spring MVC - controllers implement the legacy
  org.springframework.web.servlet.mvc.Controller interface (e.g.
  web/src/main/java/org/openmrs/web/controller/PseudoStaticContentController.java) and are
  wired through XML `SimpleUrlHandlerMapping`-style bean definitions, not
  @RequestMapping/@Controller/@RestController annotations; a repo-wide grep for those three
  annotations across non-test main source returns zero hits (the one incidental @Controller
  hit, test-suite/module/omod/.../TestModuleController.java, is test-harness scaffolding for
  module-loading tests, not the application's own HTTP surface, and was excluded).
  `containers`: only webapp/ has <packaging>war</packaging>; no module anywhere has
  @SpringBootApplication or a spring-boot-maven-plugin, so it is the sole container, kind
  war. `injections` samples @Autowired field injection across *ServiceImpl classes into
  their DAO interfaces (the dominant DI style in this codebase; no Lombok, no constructor
  injection observed in the sampled classes). `riskyFiles` used git log --no-merges over
  non-test src/main/*.java in the 12 months before the pinned commit's date (2025-09-26 to
  2026-09-26), dropping >50-file sweep commits; ties at the bottom of the top-10 were
  resolved automatically since exactly 5 files tied for 10th place and exactly 5 slots
  remained. No generated code (no /target committed, no .gitattributes generated markers)
  and no lockfile exist in this Maven-only repo, so those two roles vocabulary values have no
  real example here.
