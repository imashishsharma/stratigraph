  - { class: org.springframework.samples.petclinic.model.Pet, table: pets }
  - { class: org.springframework.samples.petclinic.model.PetType, table: types }
  - { class: org.springframework.samples.petclinic.model.Specialty, table: specialties }
  - { class: org.springframework.samples.petclinic.model.Vet, table: vets }
  - { class: org.springframework.samples.petclinic.model.Visit, table: visits }
