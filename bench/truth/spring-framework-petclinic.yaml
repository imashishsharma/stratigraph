name: spring-framework-petclinic
sha: cd43fc08e272b778e1196d0754ab86d1d42f1d5a
labelledBy: >
  Read every tracked file at the pinned commit (git ls-files), all main Java
  classes, all Spring XML context files, all four db/<vendor>/schema.sql
  files, and PetclinicInitializer.java (which replaces web.xml with a
  WebApplicationInitializer). Entities all carry explicit @Table(name=...)
  so no naming-strategy inference was needed; the hsqldb schema.sql table
  set matches the entity @Table names exactly. All DI in this repo is
  implicit constructor injection picked up by <context:component-scan> over
  @Controller/@Service/@Repository classes (Spring auto-wires a class's sole
  public constructor without needing @Autowired) — no XML <bean
  property>/<constructor-arg> wiring of application classes was found; the
  XML only wires infrastructure beans (dataSource, entityManagerFactory,
  view resolvers) that application code doesn't inject. Repository classes
  are jakarta.persistence, not javax.persistence, contradicting the
  corpus.yaml note but confirmed directly from imports. No lockfile and no
  generated code exist in this repo (no package-lock/yarn.lock, no
  @Generated files, target/ is gitignored) — both omitted from roles.
  riskyFiles has low signal: only 55 non-merge, <=50-file commits touched
  src/main in the 12 months before the pin (2025-09-01 to 2026-09-01), the
  top file has 2 commits and everything else ties at 1, so ties beyond the
  top file are broken purely by file size (no fix-like commit messages found
  in this window at all).
