name: initializr
sha: d445a056ced904ba5098df1e75b75bebf9840687
labelledBy: >
  Labelled by reading the repo directly at the pinned commit with git/grep/Read
  only (no stratigraph). IMPORTANT CORRECTION to corpus.yaml's characterization:
  at this pin the repo itself builds with Maven (root pom.xml, mvnw, .mvn/), not
  Gradle — there is no build.gradle/settings.gradle/buildSrc for this project's
  own build. The `*.gradle`/`*.gradle.kts` files corpus.yaml's "why" text likely
  saw are test/template resources: initializr *generates* Gradle (and Maven)
  builds for other projects, so its own tree is full of `.gradle`/`.gradle.kts`
  sample and golden files under src/test/resources and src/main/resources
  (bundled templates it stamps into generated projects) — those are labelled
  `test` or `vendored` below, not `manifest`, since they are not this repo's own
  build configuration. roles is a ~28-file sample. There is no lockfile (pure
  Java, no npm frontend) and no genuinely generated/build-output code committed,
  so both are omitted from roles. This is a project-generator tool with no
  database access: no JPA, no Liquibase/Flyway found anywhere (`git grep` for
  @Entity, javax/jakarta.persistence, liquibase, flyway all came back empty), so
  `entities`, `tables` and `migration`-role files are absent — noted rather than
  guessed. containers: only initializr-service-sample carries a
  @SpringBootApplication class; every other module is a library (default jar
  packaging, no Spring Boot main class) and is excluded per the aggregator/library
  rule, even though several (initializr-web, initializr-actuator) look
  service-like. endpoints (20, exhaustive) come from initializr-web's four REST
  controllers, which live in a library module consumed by initializr-service-sample
  rather than in the container itself — still counted since the instruction is
  "this repo's own controllers", not "the container's controllers"; paths are
  deduplicated where multiple @GetMapping overloads share an identical path for
  content-negotiation (e.g. GET / appears once even though two controller methods
  both map it under different `produces`); SpringCliDistributionController's
  `@GetMapping(path = {"/spring.tar.gz", "spring.tgz"})` has a literal source typo
  (missing leading slash on the second path) at
  initializr-web/src/main/java/io/spring/initializr/web/controller/SpringCliDistributionController.java:44 —
  recorded here as `/spring.tgz` for consistency with the rest of the list.
  injections (11, all Java — no frontend in this repo) are constructor-injection
  edges between repo-local classes/interfaces across initializr-web and
  initializr-actuator. riskyFiles ranks the 10 most-committed src/main/java files
  by non-merge commits in the 12 months before the pinned commit (2025-09-25 to
  2026-09-25: 152 qualifying commits after dropping 2 that touched >50 files),
  tie-broken by fix-like commit messages then file line count.
