name: eladmin
sha: 55fbf705956949697dbd68bf9003776609d3d029
labelledBy: >
  Labelled by reading git ls-files across all 5 Maven modules
  (eladmin-common/-logging/-system/-tools/-generator), grepping every
  @Entity class (21 real matches after excluding one false positive: grep
  for "@Entity" also matches "@EntityListeners" on
  eladmin-common/.../base/BaseEntity.java, which is actually
  @MappedSuperclass, not an entity — corpus.yaml's "22" figure likely
  includes that same false positive), reading each entity's @Table
  annotation, and cross-checking every resulting table name against
  sql/eladmin.sql and sql/quartz.sql (both are full DDL dumps, not
  versioned changelogs, so used as-is with no rename/drop reconciliation
  needed). injections sampled the 52 @RequiredArgsConstructor
  (Lombok final-field) classes across service/controller layers for
  diversity of module and layer. riskyFiles from
  `git log --no-merges --since=2025-05-09 --until=2026-05-09 --name-only`
  (12 non-merge commits, none touching >50 files — this window found more
  commits than the "5 commits in the 12 months before HEAD" figure in
  corpus.yaml, likely because that figure was measured from the clone date
  2026-09-28 rather than the pinned commit's date 2026-05-09), counting
  per src/main/java file and weighting ties by fix-flavoured commit
  messages (only ASCII "fix:" prefixes counted; several Chinese-only "feat:"
  security commits were NOT counted as fixes even though their content is
  security-relevant, e.g. the CSV/XLSX injection-protection commit) and by
  file size. Frontend is confirmed to live in a separate repo (eladmin-web,
  not this one) — no package.json, .vue, image, or lockfile of any kind
  exists anywhere in this checkout, so roles has no asset/lockfile entries
  and containers has no angular-app. No "generated" role exists either: the
  eladmin-generator module's *.ftl templates (Entity.ftl, Controller.ftl,
  etc.) are hand-authored FreeMarker templates that PRODUCE other code at
  codegen time — they are themselves source, not generated output — and no
  checked-in Lombok/annotation-processor output was found. No mvnw/gradlew
  wrapper exists in this repo (root pom.xml + mvn used directly). endpoints were
  enumerated by combining each @RestController's class-level @RequestMapping with
  every @GetMapping/@PostMapping/@PutMapping/@DeleteMapping/@PatchMapping and
  eladmin's custom @AnonymousGetMapping/@AnonymousPostMapping (verified these are
  meta-annotated @RequestMapping(method=GET/POST) in me.zhengjie.annotation.rest,
  so mapped to GET/POST respectively), plus one bare @RequestMapping with no
  method (AliPayController's /notify callback) listed once as GET per the
  labelling rule. This produced 139 distinct endpoints, over the 100 cap, so the
  list here is a deterministic sample: all 139 "METHOD /path" strings sorted
  lexicographically, first 100 kept.
