name: dubbo
sha: a87b134859e1b3d0871e20b9eac848abd2f0b50c
labelledBy: >
  Dubbo is an RPC/microservice framework, not a Spring application, so entities/
  tables/endpoints are skipped entirely (no JPA anywhere: `git grep -l @Entity`
  is empty; Dubbo's own service exposure model is RPC interfaces, not Spring
  MVC/JAX-RS HTTP endpoints). containers: found 6 modules under dubbo-demo/ with
  a real @SpringBootApplication main class (grep across all 4050 Java files) —
  these are example/tutorial apps bundled in the framework's own repo for
  documentation purposes, not the Dubbo framework's own shipped product (which is
  a set of libraries with no deployable of its own), so they are listed but
  flagged as demo modules rather than "real" product deployables; every other
  module (dubbo-common, dubbo-remoting, dubbo-rpc, dubbo-registry, etc.) is a
  plain library jar with no main class and no boot plugin. injections: Dubbo's
  own internal wiring uses its own SPI plugin mechanism (ExtensionLoader reading
  META-INF/dubbo/internal/* files), not Spring dependency injection, so genuine
  Spring-style @Autowired/constructor DI is concentrated almost entirely in the
  dubbo-spring-boot-project/dubbo-spring-boot-actuator module (Spring Boot
  Actuator integration) — all 10 sampled edges come from there (field injection
  via @Autowired; no @RequiredArgsConstructor/Lombok usage found in this repo).
  roles: no lockfile or vendored role exists (`git ls-files` has no jars, no
  package-lock.json/yarn.lock anywhere; Maven resolves dependencies remotely) —
  both omitted. .proto IDL files and *.ftl-equivalent are absent; the closest
  "generated"-adjacent artifacts are .proto interface definitions themselves,
  which are hand-authored source (they generate code at build time, so labelled
  `source`, not `generated`, consistent with the same call made for eladmin's
  FreeMarker templates). META-INF/services and META-INF/dubbo/internal files
  (Dubbo's own SPI registration format — one fully-qualified interface name per
  file, mapping to implementation classes) are labelled `config` as the closest
  vocabulary fit for a declarative wiring file, distinct from Liquibase/Flyway
  since there's no migration role in this repo (no database at all).
  .gitignore is labelled `config` per ADR-0030 (dotfiles). riskyFiles
  from `git log --no-merges --since=2025-09-23 --until=2026-09-23T17:50:19+0800
  --name-only`: 343 non-merge commits, 1 dropped for touching >50 files, ranked
  by commit count on src/main Java files (excluding test) then fix-flavoured
  commit messages; churn is concentrated in the newer Triple protocol
  (dubbo-rpc-triple) and HTTP/2 (dubbo-remoting-http12) modules.
